name: Android CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
        with:
          cmdline-tools-version: '16111833'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Build, domain tests and lint
        run: ./gradlew :core:model:test :app:lintDebug :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: zse-demo-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
