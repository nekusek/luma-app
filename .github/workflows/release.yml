name: Publish Android release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    # Configure this environment in GitHub Settings; keep one permanent signing key.
    environment: release
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
        with:
          cmdline-tools-version: '16111833'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Prepare signing and version
        env:
          STORE_BASE64: ${{ secrets.ZSE_SIGNING_STORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ZSE_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZSE_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ZSE_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a vMAJOR.MINOR.PATCH tag'; exit 1; }
          for name in STORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "Missing release signing secret: $name"; exit 1; }
          done
          umask 077
          printf '%s' "$STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          printf 'ZSE_SIGNING_STORE_FILE=%s\n' "$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Verify and build signed release
        env:
          ZSE_SIGNING_STORE_PASSWORD: ${{ secrets.ZSE_SIGNING_STORE_PASSWORD }}
          ZSE_SIGNING_KEY_ALIAS: ${{ secrets.ZSE_SIGNING_KEY_ALIAS }}
          ZSE_SIGNING_KEY_PASSWORD: ${{ secrets.ZSE_SIGNING_KEY_PASSWORD }}
        run: >-
          ./gradlew :core:model:test :app:lintRelease :app:assembleRelease --no-daemon
          -PappVersionName="${GITHUB_REF_NAME#v}"
          -PappVersionCode="$((100000 + GITHUB_RUN_NUMBER))"
      - name: Publish APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk="zse-dziennik-${GITHUB_REF_NAME#v}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          gh release create "$GITHUB_REF_NAME" "$apk" "$apk.sha256" --verify-tag --title "ZSE Dziennik ${GITHUB_REF_NAME#v}" --generate-notes
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
